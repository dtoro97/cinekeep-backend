spring.application.name=cinekeep-backend

spring.datasource.url=jdbc:postgresql://localhost:5333/cinekeep
spring.datasource.username=cinekeep
spring.datasource.password=cinekeep
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

cinekeep.security.jwt.secret=${CINEKEEP_JWT_SECRET:local-development-secret-change-me-before-deploying}
cinekeep.security.jwt.issuer=cinekeep
cinekeep.security.jwt.access-token-ttl=15m
cinekeep.security.refresh-token.ttl=30d
cinekeep.security.refresh-token.cookie-name=cinekeep_refresh_token
cinekeep.security.refresh-token.cookie-secure=${CINEKEEP_COOKIE_SECURE:false}

# Every endpoint returns JSON; without this springdoc documents responses as */*,
# which makes generated clients treat response bodies as binary.
springdoc.default-produces-media-type=application/json
